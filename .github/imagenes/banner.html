<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Banner</title>
  <link rel="stylesheet" href="estilos.css">
  <style>
    .texto {
      position: absolute;
      left: 90px;
      top: 92px;
      width: 680px;
    }

    .marca {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .marca img {
      width: 64px;
      height: 64px;
      border-radius: 16px;
    }

    .marca .ceja {
      font-size: 20px;
    }

    .nombre {
      margin: 22px 0 14px;
      font-family: 'Lora', serif;
      font-weight: 600;
      font-size: 80px;
      line-height: 1;
      letter-spacing: -0.01em;
    }

    .lema {
      margin: 0;
      width: 640px;
      font-size: 27px;
      line-height: 1.4;
      color: var(--tinta-suave);
    }

    .pildoras {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 30px;
      width: 640px;
    }

    .pildora {
      padding: 10px 20px;
      border-radius: 999px;
      background: #e3ece5;
      color: #4a7a63;
      font-weight: 500;
      font-size: 20px;
    }

    .pildora.apoyo {
      background: #f5e6dd;
      color: #b0603f;
    }

    /* Dos teléfonos: atrás, los datos del reloj (app Android); adelante, el inicio. */
    .telefono {
      position: absolute;
      width: 240px;
      height: 494px;
      border-width: 9px;
      border-radius: 36px;
    }

    .telefono.atras {
      left: 812px;
      top: 52px;
      transform: rotate(-4deg);
      box-shadow: 0 18px 36px rgba(62, 58, 54, 0.14);
    }

    .telefono.adelante {
      left: 972px;
      top: 92px;
    }
  </style>
</head>
<body>
  <div class="texto">
    <div class="marca">
      <img src="../../public/favicon.svg" alt="">
      <p class="ceja">Open source · Hecha en Chile</p>
    </div>
    <h1 class="nombre">Progreso Sobrio</h1>
    <p class="lema">Acompaña el día a día de quien está en abstinencia. Sin juzgar, sin diagnósticos, un día a la vez.</p>
    <div class="pildoras">
      <span class="pildora">100% offline</span>
      <span class="pildora">Sin servidor</span>
      <span class="pildora">Web y app Android</span>
      <span class="pildora apoyo">Línea 1412 a un toque</span>
    </div>
  </div>

  <div class="telefono atras"><img src="capturas/04-vista-previa-reloj.jpg" alt=""></div>
  <div class="telefono adelante"><img src="capturas/01-inicio.jpg" alt=""></div>
</body>
</html>
