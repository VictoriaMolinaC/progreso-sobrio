# Revisa cada PR hacia main y cada cambio en main: pruebas y lint de la app Android y de la PWA.
#
# Seguridad:
# - Permisos solo de lectura y sin secretos: la llave de firma del APK nunca está en GitHub.
# - Cada acción está fijada a un commit exacto (con su versión al lado), no a "la última".
# - No compila ni publica ningún APK, y no sube nada a ningún servicio.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# Si llega un commit nuevo al mismo PR, se cancela la revisión anterior (en main, nunca).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    name: Android (pruebas y lint)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # El mismo Java que pide gradle/gradle-daemon-jvm.properties (y que trae Android Studio).
      - name: Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      # Revisa que gradle-wrapper.jar sea el oficial antes de ejecutarlo.
      # Caché "basic": la de GitHub Actions, sin el servicio comercial que trae por defecto.
      - name: Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      # No necesitan la PWA compilada ni un teléfono.
      - name: Pruebas unitarias
        run: ./gradlew testDebugUnitTest

      - name: Lint de Android
        run: ./gradlew lintDebug

  pwa:
    name: PWA (lint, pruebas y build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.8.1

      - name: Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Pruebas unitarias
        run: pnpm test

      # pnpm build incluye la revisión de tipos (tsc -b), que pilla errores que las pruebas no ven.
      - name: Build
        run: pnpm build
